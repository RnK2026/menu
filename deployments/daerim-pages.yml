name: Deploy Daerim from shared source
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RnK2026/menu
          ref: main
      - name: Check shared source revision
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          deployed=$(curl --fail --silent --max-time 20 "https://rnk2026.github.io/daerim/source-revision.txt?run=${GITHUB_RUN_ID}" || true)
          current=$(git rev-parse HEAD)
          if [ "$deployed" != "$current" ] || [ "$EVENT_NAME" != "schedule" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.source.outputs.changed == 'true'
        with:
          node-version: '22'
      - run: npm test && npm run check
        if: steps.source.outputs.changed == 'true'
      - run: npm run build -- daerim
        if: steps.source.outputs.changed == 'true'
      - uses: actions/configure-pages@v5
        if: steps.source.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.source.outputs.changed == 'true'
        with:
          path: _site/daerim
      - name: Deploy
        if: steps.source.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
